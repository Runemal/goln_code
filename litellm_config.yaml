# Стабильные локальные алиасы. Реальные model ID задаются через .env.
  - model_name: local/ollama
    litellm_params:
      model: os.environ/OLLAMA_MODEL
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 300
    model_info:
      mode: chat
  - model_name: local/lmstudio
    litellm_params:
      model: os.environ/LM_STUDIO_MODEL
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: os.environ/LM_STUDIO_API_KEY
      timeout: 300
    model_info:
      mode: chat

# Динамические каталоги. Суффикс запроса передаётся локальному провайдеру:
# ollama/gemma4:latest -> ollama_chat/gemma4:latest
# lmstudio/granite-4.0-h-tiny -> openai/granite-4.0-h-tiny
  - model_name: ollama/*
    litellm_params:
      model: ollama_chat/*
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 300
  - model_name: lmstudio/*
    litellm_params:
      model: openai/*
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: os.environ/LM_STUDIO_API_KEY
      timeout: 300

