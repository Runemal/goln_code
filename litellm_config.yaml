litellm_settings:
  # Раскрывает wildcard-маршруты через живые /api/tags и /v1/models провайдеров.
  check_provider_endpoint: true
  drop_params: true
  request_timeout: 60

router_settings:
  routing_strategy: latency-based-routing
  # Codex sends this Responses API field, but NVIDIA NIM rejects it.
  default_litellm_params:
    additional_drop_params:
      - client_metadata
  num_retries: 1
  timeout: 60
  allowed_fails: 2
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
