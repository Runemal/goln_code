name: ${COMPOSE_PROJECT_NAME:-litellm-gateway}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - litellm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database@sha256:72360d8bd5602faa49be5098a8ac3dd069d9fb74503d6bd014242d96dc753e43}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4001}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./cloudru_compat.py:/app/cloudru_compat.py:ro
      - ./yandex_compat.py:/app/yandex_compat.py:ro
    environment:
      # Заглушка позволяет поднять локальный-only стек без NVIDIA-аккаунта.
      # NVIDIA-маршруты требуют настоящий nvapi-ключ.
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-nvapi-not-configured}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE:-https://integrate.api.nvidia.com/v1}
      CLOUDRU_API_BASE: ${CLOUDRU_API_BASE:-https://foundation-models.api.cloud.ru/v1}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-not-configured}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-not-configured}
      YANDEX_API_BASE: ${YANDEX_API_BASE:-https://ai.api.cloud.yandex.net/v1}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-not-configured}
      YANDEX_CHAT_MODEL: ${YANDEX_CHAT_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/aliceai-llm-flash/latest}
      YANDEX_LITE_MODEL: ${YANDEX_LITE_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/yandexgpt-lite/latest}
      YANDEX_ALICE_MODEL: ${YANDEX_ALICE_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/aliceai-llm/latest}
      YANDEX_GPT5_LITE_MODEL: ${YANDEX_GPT5_LITE_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/yandexgpt-5-lite/latest}
      YANDEX_GPT5_PRO_MODEL: ${YANDEX_GPT5_PRO_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/yandexgpt-5-pro/latest}
      YANDEX_GPT51_MODEL: ${YANDEX_GPT51_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/yandexgpt-5.1/latest}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/yandexgpt/latest}
      YANDEX_DEEPSEEK_V4_FLASH_MODEL: ${YANDEX_DEEPSEEK_V4_FLASH_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/deepseek-v4-flash/latest}
      YANDEX_DEEPSEEK_V41_FLASH_MODEL: ${YANDEX_DEEPSEEK_V41_FLASH_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/deepseek-v4.1-flash/latest}
      YANDEX_GPT_OSS_20B_MODEL: ${YANDEX_GPT_OSS_20B_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/gpt-oss-20b/latest}
      YANDEX_GPT_OSS_120B_MODEL: ${YANDEX_GPT_OSS_120B_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/gpt-oss-120b/latest}
      YANDEX_QWEN_MODEL: ${YANDEX_QWEN_MODEL:-openai/gpt://${YANDEX_FOLDER_ID:-not-configured}/qwen3.6-35b-a3b/latest}
      YANDEX_EMBEDDING_MODEL: ${YANDEX_EMBEDDING_MODEL:-openai/emb://${YANDEX_FOLDER_ID:-not-configured}/text-embeddings-v2-doc/latest}
      YANDEX_QUERY_EMBEDDING_MODEL: ${YANDEX_QUERY_EMBEDDING_MODEL:-openai/emb://${YANDEX_FOLDER_ID:-not-configured}/text-embeddings-v2-query/latest}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Укажите LITELLM_MASTER_KEY в .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama_chat/gemma4:12b}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-openai/replace-with-loaded-model-id}
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
    command: --config /app/config.yaml --host 0.0.0.0 --port 4000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 120s

volumes:
  litellm_db:
